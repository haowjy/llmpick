# What llmpick can serve. This is the starter file `llmpick init` writes:
# replace the example engine and profile with your own. There is no command
# for adding one, and llmpick reads this file on every run.
#
# Only facts that cannot be checked go here. Whether an engine is installed,
# whether files are downloaded and whether a profile is serving are all
# worked out when llmpick runs, so never record them here.
#
# ADD AN ENGINE (a program that serves models). Install it first, then:
#
#   [engines.<id>]
#   name = "..."       shown in lists
#   version = "..."    shown in lists; kept current by hand
#   bin = "..."        a command on PATH, or a full path
#   cwd = "..."        optional: directory to run from
#   requires = "..."   optional: a path that must exist for the engine to count
#                      as installed, when bin is generic (python)
#
#   health = "..."     optional: the path that answers once the server can
#                      take requests. Default "/health".
#
# ADD A MODEL (a profile: an engine, the files it loads, and a port):
#
#   [profiles."<id>"]  letters, digits, . _ - only
#                      Name it <model>-<quant>, such as qwen3.5-9b-q8: the model
#                      first, the quant last, and no engine (it has its own field).
#                      Rename a profile only while it is stopped.
#   engine = "<engine id>"
#   port = 18080       profiles may share a port; one serves at a time
#   dir = "..."        folder the files live in
#   repo = "..."       Hugging Face repo, for `llmpick download`; omit if the
#                      engine fetches its own files
#   files = { weights = "file.gguf", ... }   names on the left are free
#   args = [...]       the engine's arguments, one item each. {port} and {dir}
#                      are replaced with the values above, and {<name>} with
#                      the full path of that entry in files.
#   context, note, published, local          optional, display only. Speeds are
#                      tok/s at 3K / 32K / 100K prompt tokens unless they say
#                      otherwise; local is what was measured on this machine.
#
# Then check it: `llmpick show <id>` prints the resolved command and marks each
# file present or missing, and reports a mistake in this file as an error.
# `llmpick download <id>` fetches missing files.

[engines.llamacpp]
name = "llama.cpp"
version = "b0000"
bin = "llama-server"

[profiles."example-q4"]
engine = "llamacpp"
port = 8080
context = "32K"
note = "Replace repo and file names with a real model."
dir = "/path/to/models/example"
repo = "someone/Example-Model-GGUF"
files = { weights = "example-model-Q4_K_M.gguf" }
args = ["-m", "{weights}", "-c", "32768", "-ngl", "999", "--host", "127.0.0.1", "--port", "{port}"]
published = "60 / 55 / 40"

# HARNESSES: coding agents whose own config llmpick keeps pointed at whatever
# is serving. Starting a profile writes `entry` into the harness's config file,
# starting another rewrites it, and a stop or a crash removes it. llmpick edits
# only the files named here, and only its own entry in them: whatever is at
# `at` is llmpick's, to overwrite and to remove, so do not keep anything of
# your own there. Delete a block and llmpick leaves that harness alone.
#
#   [harnesses.<name>]
#   dir = [...]     folders the config may be in. ~ is your home folder and
#                   $NAME an environment variable; the first folder whose
#                   variables are all set is used, and the harness is skipped
#                   if that folder does not exist.
#   files = [...]   config file names there: the first that exists is edited,
#                   else the first is created. JSON, comments allowed.
#   at = [...]      where the entry goes in that file
#   model = "..."   what the harness calls the model; shown by `llmpick status`
#   [harnesses.<name>.entry]   the entry itself. {id} is the profile, {engine}
#                   its engine's name and {url} the server's address. {context}
#                   (tokens) and {inputs} (["text"] or ["text", "image"]) are
#                   asked of the server; a value that is exactly "{context}"
#                   becomes the number, and its key is left out when the server
#                   does not say.

# pi (https://pi.dev). Opening its model picker rereads the file.
[harnesses.pi]
dir = ["$PI_CODING_AGENT_DIR", "~/.pi/agent"]
files = ["models.json"]
at = ["providers", "llmpick"]
model = "llmpick/local"

[harnesses.pi.entry]
baseUrl = "{url}"
api = "openai-completions"
apiKey = "llmpick" # pi lists a model only when its provider has a key; a local server ignores it
compat = { supportsDeveloperRole = false }

[[harnesses.pi.entry.models]]
id = "local"
name = "{id} <{engine}>"
input = "{inputs}"
contextWindow = "{context}"
cost = { input = 0, output = 0, cacheRead = 0, cacheWrite = 0 }

# opencode (https://opencode.ai), config format of version 2. It reads
# opencode.json and opencode.jsonc together and notices changes by itself.
[harnesses.opencode]
dir = ["$XDG_CONFIG_HOME/opencode", "~/.config/opencode"]
files = ["opencode.json", "opencode.jsonc"]
at = ["providers", "llmpick"]
model = "llmpick/local"

[harnesses.opencode.entry]
name = "llmpick"
package = "@opencode/ai/providers/openai-compatible"
settings = { baseURL = "{url}", apiKey = "llmpick" }

[harnesses.opencode.entry.models.local]
name = "{id} <{engine}>"
limit = { context = "{context}" }
capabilities = { tools = true, input = "{inputs}" }
